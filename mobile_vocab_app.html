<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="영어 단어장" />
  <title>영어 단어장</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-sub: #f8fafc;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --primary-border: #bfdbfe;
      --success: #16a34a;
      --success-soft: #f0fdf4;
      --success-border: #bbf7d0;
      --warning-bg: #fffbeb;
      --warning-text: #b45309;
      --warning-border: #fde68a;
      --danger-bg: #fef2f2;
      --danger-text: #b91c1c;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 8px 24px -4px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: calc(76px + env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }

    /* Top Bar */
    header {
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 12px 16px 12px;
      border-bottom: 1px solid var(--border);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .mode-segmented {
      display: inline-flex;
      background: #f1f5f9;
      padding: 3px;
      border-radius: 10px;
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .seg-btn.active {
      background: var(--surface);
      color: var(--text-primary);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    .progress-pill {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-soft);
      border: 1px solid var(--primary-border);
      padding: 5px 11px;
      border-radius: 999px;
    }

    /* Category Filter Chips */
    .filter-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .filter-scroll::-webkit-scrollbar {
      display: none;
    }

    .chip {
      white-space: nowrap;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      background: var(--surface-sub);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip.active {
      background: var(--text-primary);
      color: #ffffff;
      border-color: var(--text-primary);
    }

    /* Main Content */
    main {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    /* Flashcard Mode */
    .flashcard-view {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 14px;
    }

    .flashcard {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px 20px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 360px;
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .flashcard.revealed {
      border-color: var(--primary-border);
    }

    /* Card Top Header */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .card-tag {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 5px 10px;
      border-radius: 8px;
    }

    .card-index {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    /* Card Question Area */
    .question-section {
      margin-bottom: 16px;
    }

    .ko-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }

    .ko-sentence {
      font-size: 1.32rem;
      font-weight: 800;
      line-height: 1.48;
      color: var(--text-primary);
      word-break: keep-all;
      margin-bottom: 14px;
    }

    .hint-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--warning-text);
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      padding: 8px 12px;
      border-radius: 10px;
      line-height: 1.4;
      width: 100%;
    }

    /* Card Answer Area */
    .answer-section {
      display: none;
      margin-top: 16px;
      padding-top: 18px;
      border-top: 1.5px dashed var(--border);
      animation: slideDown 0.2s ease-out;
    }

    .flashcard.revealed .answer-section {
      display: block;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .en-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .en-sentence {
      font-size: 1.28rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.42;
      margin-bottom: 14px;
      letter-spacing: -0.01em;
    }

    /* Dedicated Audio Control Strip Inside Card */
    .audio-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .audio-btn {
      border: 1px solid var(--border-strong);
      background: var(--surface-sub);
      color: var(--text-primary);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, transform 0.1s;
    }

    .audio-btn:active {
      transform: scale(0.97);
      background: #e2e8f0;
    }

    .tip-box {
      font-size: 0.88rem;
      color: var(--text-secondary);
      background: var(--surface-sub);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.55;
      word-break: keep-all;
    }

    .before-box {
      margin-top: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--danger-text);
      background: var(--danger-bg);
      padding: 9px 12px;
      border-radius: 10px;
      line-height: 1.45;
    }

    /* Card Footer Prompt */
    .reveal-prompt {
      margin-top: 20px;
      padding: 13px;
      border-radius: 12px;
      background: var(--primary-soft);
      color: var(--primary);
      text-align: center;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .flashcard.revealed .reveal-prompt {
      display: none;
    }

    /* List Mode */
    .list-view {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .list-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }

    .list-card.memorized {
      background: #f8fafc;
      border-color: var(--success-border);
    }

    .list-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .list-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      border: 1px solid var(--border);
      background: var(--surface-sub);
      color: var(--text-secondary);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .icon-btn.done {
      background: var(--success-soft);
      color: var(--success);
      border-color: var(--success-border);
    }

    .list-ko {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .list-en {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .list-tip {
      font-size: 0.82rem;
      color: var(--text-secondary);
      background: var(--surface-sub);
      padding: 8px 10px;
      border-radius: 8px;
      line-height: 1.45;
    }

    /* Fixed Bottom Control Bar (Flashcard Mode) */
    .bottom-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 480px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: 88px 1fr 88px;
      gap: 10px;
      z-index: 30;
    }

    .dock-btn {
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text-primary);
      border-radius: 14px;
      height: 48px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .dock-btn:active {
      transform: scale(0.97);
      background: #f1f5f9;
    }

    .dock-btn-check {
      background: var(--surface);
      color: var(--text-primary);
      border: 1.5px solid var(--border-strong);
    }

    .dock-btn-check.memorized {
      background: var(--success);
      color: #ffffff;
      border-color: var(--success);
    }
  </style>
</head>

  <header>
    <div class="top-bar">
      <div class="mode-segmented">
        <button class="seg-btn active" id="tabFlash" onclick="switchMode('flash')">카드 학습</button>
        <button class="seg-btn" id="tabList" onclick="switchMode('list')">전체 목록</button>
      </div>
      <div class="progress-pill" id="progressBadge">암기 0 / 0</div>
    </div>

    <div class="filter-scroll" id="categoryChips">

      <button class="chip" data-cat="biz">비즈니스 패턴</button>
      <button class="chip" data-cat="phrasal">필수 구동사</button>
      <button class="chip" data-cat="travel">여행·스몰토크</button>
      <button class="chip" data-cat="all">전체</button>
    </div>
  </header>

  <main>
    <!-- Flashcard View -->
    <div class="flashcard-view" id="flashcardView">
      <div class="flashcard" id="flashcard" onclick="toggleReveal()">
        <div>
          <div class="card-header">
            <span class="card-tag" id="cardTag">Day 3</span>
            <span class="card-index" id="cardCounter">1 / 6</span>
          </div>

          <div class="question-section">
            <div class="ko-label">한국어 문장</div>
            <div class="ko-sentence" id="koSentence">나 이제 막 이메일을 보내려던 참이야.</div>
            <div class="hint-pill" id="hintBox">💡 힌트: I'm about to ~</div>
          </div>

          <div class="answer-section">
            <div class="en-label">영어 표현</div>
            <div class="en-sentence" id="enSentence">I'm about to send the email.</div>

            <div class="audio-bar" onclick="event.stopPropagation()">
              <button class="audio-btn" onclick="speakCurrent(0.96)">🔊 보통 속도</button>
              <button class="audio-btn" onclick="speakCurrent(0.75)">🐢 느린 속도</button>
            </div>

            <div class="tip-box" id="tipText">상사나 동료가 '그거 했어?'라고 물을 때 '마침 지금 막 ~하려던 참이에요!'라고 답하는 최고의 패턴입니다.</div>
            <div class="before-box" id="beforeBox" style="display:none;"></div>
          </div>
        </div>

        <div class="reveal-prompt">👆 카드를 터치해서 정답 확인하기</div>
      </div>
    </div>

    <!-- List View -->
    <div class="list-view" id="listView"></div>
  </main>

  <!-- Bottom Navigation Bar for Flashcard Mode -->
  <div class="bottom-dock" id="bottomDock">
    <button class="dock-btn" onclick="prevCard()">‹ 이전</button>
    <button class="dock-btn dock-btn-check" id="memorizeBtn" onclick="toggleMemorize()">✓ 암기 완료 체크</button>
    <button class="dock-btn" onclick="nextCard()">다음 ›</button>
  </div>

    let currentCategory = "day3";
    let currentIndex = 0;
    let memorizedIds = JSON.parse(localStorage.getItem("jireumgil_memorized") || "[]");

    function getFilteredCards() {
      if (currentCategory === "all") return cardsData;
      return cardsData.filter(c => c.cat === currentCategory);
    }

    function updateProgress() {
      const total = cardsData.length;
      const done = memorizedIds.length;
      document.getElementById("progressBadge").textContent = `암기 ${done} / ${total}`;
    }

    function renderCard() {
      const list = getFilteredCards();
      if (list.length === 0) return;
      if (currentIndex >= list.length) currentIndex = 0;
      if (currentIndex < 0) currentIndex = list.length - 1;

      const card = list[currentIndex];
      const flashcardEl = document.getElementById("flashcard");
      flashcardEl.classList.remove("revealed");

      document.getElementById("cardCounter").textContent = `${currentIndex + 1} / ${list.length}`;
      document.getElementById("cardTag").textContent = card.tag;
      document.getElementById("koSentence").textContent = card.ko;
      document.getElementById("hintBox").textContent = `💡 ${card.hint}`;
      document.getElementById("enSentence").textContent = card.en;
      document.getElementById("tipText").textContent = card.tip;

      const beforeEl = document.getElementById("beforeBox");
      if (card.before) {
        beforeEl.style.display = "block";
        beforeEl.textContent = `✍️ ${card.before}`;
      } else {
        beforeEl.style.display = "none";
      }

      const memBtn = document.getElementById("memorizeBtn");
      const isMem = memorizedIds.includes(card.id);
      if (isMem) {
        memBtn.classList.add("memorized");
        memBtn.textContent = "✓ 암기 완료됨";
      } else {
        memBtn.classList.remove("memorized");
        memBtn.textContent = "✓ 암기 완료 체크";
      }

      updateProgress();
    }

    function toggleReveal() {
      document.getElementById("flashcard").classList.toggle("revealed");
    }

    function prevCard() {
      currentIndex--;
      renderCard();
    }

    function nextCard() {
      currentIndex++;
      renderCard();
    }

    function toggleMemorize() {
      const list = getFilteredCards();
      const card = list[currentIndex];
      if (!card) return;

      const idx = memorizedIds.indexOf(card.id);
      if (idx === -1) {
        memorizedIds.push(card.id);
      } else {
        memorizedIds.splice(idx, 1);
      }
      localStorage.setItem("jireumgil_memorized", JSON.stringify(memorizedIds));
      renderCard();
      renderList();
    }

    function speakText(text, rate = 0.95) {
      if (!("speechSynthesis" in window)) {
        alert("이 브라우저는 음성 읽기를 지원하지 않습니다.");
        return;
      }
      window.speechSynthesis.cancel();
      const cleanText = text.replace(/\(.*?\)/g, "").replace(/\//g, ". ");
      const utter = new SpeechSynthesisUtterance(cleanText);
      utter.lang = "en-US";
      utter.rate = rate;
      window.speechSynthesis.speak(utter);
    }

    function speakCurrent(rate) {
      const list = getFilteredCards();
      const card = list[currentIndex];
      if (!card) return;
      speakText(card.en, rate);
    }

    function renderList() {
      const list = getFilteredCards();
      const container = document.getElementById("listView");
      container.innerHTML = "";

      list.forEach((card) => {
        const isMem = memorizedIds.includes(card.id);
        const div = document.createElement("div");
        div.className = "list-card" + (isMem ? " memorized" : "");
        div.innerHTML = `
          <div class="list-card-top">
            <span class="card-tag">${card.tag}</span>
            <div class="list-actions">
              <button class="icon-btn" onclick="speakText('${card.en.replace(/'/g, "\\'")}', 0.95)">🔊 듣기</button>
              <button class="icon-btn ${isMem ? "done" : ""}" onclick="toggleMemById('${card.id}')">${isMem ? "✓ 완료" : "암기 체크"}</button>
            </div>
          </div>
          <div class="list-ko">${card.ko}</div>
          <div class="list-en">${card.en}</div>
          <div class="list-tip">${card.tip}</div>
        `;
        container.appendChild(div);
      });
    }

    function toggleMemById(id) {
      const idx = memorizedIds.indexOf(id);
      if (idx === -1) memorizedIds.push(id);
      else memorizedIds.splice(idx, 1);
      localStorage.setItem("jireumgil_memorized", JSON.stringify(memorizedIds));
      renderCard();
      renderList();
    }

    function switchMode(mode) {
      const fView = document.getElementById("flashcardView");
      const lView = document.getElementById("listView");
      const dock = document.getElementById("bottomDock");
      const tFlash = document.getElementById("tabFlash");
      const tList = document.getElementById("tabList");

      if (mode === "flash") {
        fView.style.display = "flex";
        lView.style.display = "none";
        dock.style.display = "grid";
        tFlash.classList.add("active");
        tList.classList.remove("active");
      } else {
        fView.style.display = "none";
        lView.style.display = "flex";
        dock.style.display = "none";
        tFlash.classList.remove("active");
        tList.classList.add("active");
        renderList();
      }
    }

    document.querySelectorAll(".chip").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".chip").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentCategory = btn.getAttribute("data-cat");
        currentIndex = 0;
        renderCard();
        renderList();
      });
    });

    renderCard();
  </script>
