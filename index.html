<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="지름길 비즈니스 영어" />
  <title>지름길 비즈니스 영어 단어장</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-dark: #0284c7;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: 84px;
    }

    header {
      padding: 20px 18px 12px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--card-border);
    }

    .header-top {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 10px;
    }

    .progress-badge {
      font-size: 0.8rem;
      background: #1e293b;
      border: 1px solid var(--card-border);
      padding: 4px 10px;
      border-radius: 999px;
      color: var(--accent);
      font-weight: 600;
    }

    .filter-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-scroll::-webkit-scrollbar {
      display: none;
    }

    .chip {
      white-space: nowrap;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      background: var(--card-bg);
      color: var(--text-sub);
      border: 1px solid var(--card-border);
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    main {
      flex: 1;
      padding: 16px;
    }

    /* Flashcard Mode */
    .flashcard-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-counter {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .flashcard {
      background: linear-gradient(145deg, #1e293b, #172033);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 28px 22px;
      min-height: 310px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      position: relative;
      transition: transform 0.15s ease, border-color 0.2s ease;
    }

    .flashcard:active {
      transform: scale(0.985);
    }

    .flashcard.revealed {
      border-color: var(--accent);
    }

    .card-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      padding: 4px 10px;
      border-radius: 8px;
      align-self: flex-start;
    }

    .card-body {
      margin: 20px 0;
    }

    .ko-sentence {
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1.45;
      color: var(--text-main);
      margin-bottom: 16px;
    }

    .hint-box {
      font-size: 0.88rem;
      color: var(--warning);
      background: rgba(245, 158, 11, 0.1);
      border-left: 3px solid var(--warning);
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 16px;
    }

    .answer-section {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed var(--card-border);
      animation: fadeIn 0.25s ease;
    }

    .flashcard.revealed .answer-section {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .en-sentence {
      font-size: 1.25rem;
      font-weight: 800;
      color: #38bdf8;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .tip-text {
      font-size: 0.86rem;
      color: #cbd5e1;
      line-height: 1.5;
      background: rgba(255, 255, 255, 0.04);
      padding: 10px 12px;
      border-radius: 10px;
    }

    .before-box {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.1);
      padding: 8px 10px;
      border-radius: 8px;
    }

    .tap-guide {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .flashcard.revealed .tap-guide {
      display: none;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-tts {
      background: #334155;
      color: var(--text-main);
      grid-column: span 2;
    }

    .btn-nav {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    .btn-check {
      background: var(--card-bg);
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.4);
      grid-column: span 2;
    }

    .btn-check.memorized {
      background: var(--success);
      color: #052e16;
    }

    /* List Mode */
    .list-container {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .list-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
    }

    .list-item.memorized {
      border-color: rgba(34, 197, 94, 0.45);
      opacity: 0.78;
    }

    .list-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .list-en {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 4px;
      line-height: 1.35;
    }

    .list-ko {
      font-size: 0.92rem;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .list-tip {
      font-size: 0.8rem;
      color: var(--text-sub);
      line-height: 1.4;
    }

    .mini-btns {
      display: flex;
      gap: 6px;
    }

    .mini-btn {
      background: #334155;
      border: none;
      color: var(--text-main);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 480px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--card-border);
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 10px 16px 20px;
      gap: 10px;
      z-index: 20;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-sub);
      padding: 10px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--accent);
      border-color: var(--card-border);
    }
  </style>
</head>

        </div>
        <div class="tap-guide">👆 카드를 터치하면 영어 정답이 보입니다</div>
      </div>

      <div class="action-row">
        <button class="btn btn-tts" onclick="speakCurrent(event)">🔊 원어민 발음 듣기 (느리게/보통)</button>
        <button class="btn btn-nav" onclick="prevCard()">⬅️ 이전 문장</button>
        <button class="btn btn-nav" onclick="nextCard()">다음 문장 ➡️</button>
        <button class="btn btn-check" id="memorizeBtn" onclick="toggleMemorize()">✅ 외웠어요 체크</button>
      </div>
    </div>

    <!-- List View -->
    <div class="list-container" id="listView"></div>
  </main>

  <nav class="bottom-nav">
    <button class="tab-btn active" id="tabFlash" onclick="switchMode('flash')">🗂️ 1초 말하기 카드</button>
    <button class="tab-btn" id="tabList" onclick="switchMode('list')">📋 전체 문장 리스트</button>

      },
      {
        id: "biz-8",
        cat: "biz",
        tag: "비즈니스 필수 (이해/공감)",

      // Phrasal Verbs
      {

      },
      {

      },
      {

        ko: "내가 그거 잘 지켜볼게. / 몇 시에 퇴근하세요?",
        hint: "지켜보다: keep an eye on / 퇴근하다: get off work",

      {

      },
      {

        cat: "travel",
        tag: "스몰토크 / 성향",

        en: "I'm gonna head home now.",
        tip: "🔊 발음: '암거너 헤롬나우' (head home의 h가 약해져서 헤롬으로 연음됨!)"
      },
      {
        id: "trv-4",
        cat: "travel",
        tag: "해외식당 리스닝",
        ko: "아직 식사 중이신가요? / 식사는 다 괜찮으셨나요?",
        hint: "식당 직원이 그릇 치우기 전에 묻는 말",
        en: "Are you still working on that? / Did you find everything okay?",
        tip: "식당에서 work on은 '음식을 먹는 중', find는 '경험해보고 느끼다'라는 뜻으로 쓰입니다."
      }
    ];

    let currentCategory = "day2";
    let currentIndex = 0;
    let slowToggle = false;
    let memorizedIds = JSON.parse(localStorage.getItem("jireumgil_memorized") || "[]");

    function getFilteredCards() {
      if (currentCategory === "all") return cardsData;
      return cardsData.filter(c => c.cat === currentCategory);
    }

    function updateProgress() {
      const total = cardsData.length;
      const done = memorizedIds.length;
      document.getElementById("progressBadge").textContent = `암기 ${done} / ${total}`;
    }

    function renderCard() {
      const list = getFilteredCards();
      if (list.length === 0) return;
      if (currentIndex >= list.length) currentIndex = 0;
      if (currentIndex < 0) currentIndex = list.length - 1;

      const card = list[currentIndex];
      const flashcardEl = document.getElementById("flashcard");
      flashcardEl.classList.remove("revealed");

      document.getElementById("cardCounter").textContent = `${currentIndex + 1} / ${list.length}`;
      document.getElementById("cardTag").textContent = card.tag;
      document.getElementById("koSentence").textContent = card.ko;
      document.getElementById("hintBox").textContent = `💡 ${card.hint}`;
      document.getElementById("enSentence").textContent = card.en;
      document.getElementById("tipText").textContent = card.tip;

      const beforeEl = document.getElementById("beforeBox");
      if (card.before) {
        beforeEl.style.display = "block";
        beforeEl.textContent = card.before;
      } else {
        beforeEl.style.display = "none";
      }

      const memBtn = document.getElementById("memorizeBtn");
      const isMem = memorizedIds.includes(card.id);
      if (isMem) {
        memBtn.classList.add("memorized");
        memBtn.textContent = "🎉 외움 완료! (터치시 해제)";
      } else {
        memBtn.classList.remove("memorized");
        memBtn.textContent = "✅ 외웠어요 체크";
      }

      updateProgress();
    }

    function toggleReveal() {
      document.getElementById("flashcard").classList.toggle("revealed");
    }

    function prevCard() {
      currentIndex--;
      renderCard();
    }

    function nextCard() {
      currentIndex++;
      renderCard();
    }

    function toggleMemorize() {
      const list = getFilteredCards();
      const card = list[currentIndex];
      if (!card) return;

      const idx = memorizedIds.indexOf(card.id);
      if (idx === -1) {
        memorizedIds.push(card.id);
      } else {
        memorizedIds.splice(idx, 1);
      }
      localStorage.setItem("jireumgil_memorized", JSON.stringify(memorizedIds));
      renderCard();
      renderList();
    }

    function speakText(text, rate = 0.95) {
      if (!("speechSynthesis" in window)) {
        alert("이 브라우저는 음성 읽기를 지원하지 않습니다.");
        return;
      }
      window.speechSynthesis.cancel();
      // Remove parenthetical notes if any
      const cleanText = text.replace(/\(.*?\)/g, "").replace(/\//g, ". ");
      const utter = new SpeechSynthesisUtterance(cleanText);
      utter.lang = "en-US";
      utter.rate = rate;
      window.speechSynthesis.speak(utter);
    }

    function speakCurrent(e) {
      if (e) e.stopPropagation();
      const list = getFilteredCards();
      const card = list[currentIndex];
      if (!card) return;
      const rate = slowToggle ? 0.78 : 0.96;
      slowToggle = !slowToggle;
      speakText(card.en, rate);
    }

    function renderList() {
      const list = getFilteredCards();
      const container = document.getElementById("listView");
      container.innerHTML = "";

      list.forEach((card) => {
        const isMem = memorizedIds.includes(card.id);
        const div = document.createElement("div");
        div.className = "list-item" + (isMem ? " memorized" : "");
        div.innerHTML = `
          <div class="list-top">
            <span class="card-tag">${card.tag}</span>
            <div class="mini-btns">
              <button class="mini-btn" onclick="speakText('${card.en.replace(/'/g, "\\'")}', 0.95)">🔊 발음</button>
              <button class="mini-btn" onclick="toggleMemById('${card.id}')">${isMem ? "🎉 완료" : "✅ 체크"}</button>
            </div>
          </div>
          <div class="list-en">${card.en}</div>
          <div class="list-ko">${card.ko}</div>
          <div class="list-tip">${card.tip}</div>
        `;
        container.appendChild(div);
      });
    }

    function toggleMemById(id) {
      const idx = memorizedIds.indexOf(id);
      if (idx === -1) memorizedIds.push(id);
      else memorizedIds.splice(idx, 1);
      localStorage.setItem("jireumgil_memorized", JSON.stringify(memorizedIds));
      renderCard();
      renderList();
    }

    function switchMode(mode) {
      const fView = document.getElementById("flashcardView");
      const lView = document.getElementById("listView");
      const tFlash = document.getElementById("tabFlash");
      const tList = document.getElementById("tabList");

      if (mode === "flash") {
        fView.style.display = "flex";
        lView.style.display = "none";
        tFlash.classList.add("active");
        tList.classList.remove("active");
      } else {
        fView.style.display = "none";
        lView.style.display = "flex";
        tFlash.classList.remove("active");
        tList.classList.add("active");
        renderList();
      }
    }

    document.querySelectorAll(".chip").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".chip").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentCategory = btn.getAttribute("data-cat");
        currentIndex = 0;
        renderCard();
        renderList();
      });
    });

    // Initial render
    renderCard();
  </script>
</body>
