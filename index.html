<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="영어 단어장" />
  <title>영어 단어장</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-sub: #f8fafc;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --primary-border: #bfdbfe;
      --yt-red: #dc2626;
      --yt-soft: #fef2f2;
      --yt-border: #fecaca;
      --warning-bg: #fffbeb;
      --warning-text: #b45309;
      --warning-border: #fde68a;
      --danger-bg: #fef2f2;
      --danger-text: #b91c1c;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 8px 24px -4px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: calc(76px + env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }

    /* Top Bar */
    header {
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 12px 16px 12px;
      border-bottom: 1px solid var(--border);
    }

    .top-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
    }

    .mode-segmented {
      display: grid;
      grid-template-columns: 1fr 1fr 1.15fr;
      width: 100%;
      background: #f1f5f9;
      padding: 3px;
      border-radius: 10px;
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 7px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .seg-btn.active {
      background: var(--surface);
      color: var(--text-primary);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    /* Category Filter Chips */
    .filter-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .filter-scroll::-webkit-scrollbar {
      display: none;
    }

    .chip {
      white-space: nowrap;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      background: var(--surface-sub);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip.active {
      background: var(--text-primary);
      color: #ffffff;
      border-color: var(--text-primary);
    }

    /* Main Content */
    main {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    /* Flashcard Mode */
    .flashcard-view {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 14px;
    }

    .flashcard {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px 20px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 360px;
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .flashcard.revealed {
      border-color: var(--primary-border);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .card-tag {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 5px 10px;
      border-radius: 8px;
    }

    .card-index {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .question-section {
      margin-bottom: 16px;
    }

    .ko-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }

    .ko-sentence {
      font-size: 1.32rem;
      font-weight: 800;
      line-height: 1.48;
      color: var(--text-primary);
      word-break: keep-all;
      margin-bottom: 14px;
    }

    .hint-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--warning-text);
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      padding: 8px 12px;
      border-radius: 10px;
      line-height: 1.4;
      width: 100%;
    }

    .answer-section {
      display: none;
      margin-top: 16px;
      padding-top: 18px;
      border-top: 1.5px dashed var(--border);
      animation: slideDown 0.2s ease-out;
    }

    .flashcard.revealed .answer-section {
      display: block;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .en-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .en-sentence {
      font-size: 1.28rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.42;
      margin-bottom: 14px;
      letter-spacing: -0.01em;
    }

    .audio-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .audio-btn {
      border: 1px solid var(--border-strong);
      background: var(--surface-sub);
      color: var(--text-primary);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, transform 0.1s;
    }

    .audio-btn:active {
      transform: scale(0.97);
      background: #e2e8f0;
    }

    .tip-box {
      font-size: 0.88rem;
      color: var(--text-secondary);
      background: var(--surface-sub);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.55;
      word-break: keep-all;
    }

    .before-box {
      margin-top: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--danger-text);
      background: var(--danger-bg);
      padding: 9px 12px;
      border-radius: 10px;
      line-height: 1.45;
    }

    .reveal-prompt {
      margin-top: 20px;
      padding: 13px;
      border-radius: 12px;
      background: var(--primary-soft);
      color: var(--primary);
      text-align: center;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .flashcard.revealed .reveal-prompt {
      display: none;
    }

    /* List Mode */
    .list-view {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .list-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }

    .list-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .list-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      border: 1px solid var(--border);
      background: var(--surface-sub);
      color: var(--text-secondary);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .list-ko {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .list-en {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .list-tip {
      font-size: 0.82rem;
      color: var(--text-secondary);
      background: var(--surface-sub);
      padding: 8px 10px;
      border-radius: 8px;
      line-height: 1.45;
    }

    /* Shorts 30 Archive Mode */
    .shorts-view {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .shorts-part-filter {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      margin-bottom: 4px;
    }
    .shorts-part-filter::-webkit-scrollbar {
      display: none;
    }

    .part-chip {
      white-space: nowrap;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      background: #e2e8f0;
      color: var(--text-secondary);
      border: none;
      cursor: pointer;
    }

    .part-chip.active {
      background: var(--primary);
      color: #ffffff;
    }

    .video-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .video-header {
      padding: 15px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      background: var(--surface);
      cursor: pointer;
    }

    .video-title-wrap {
      flex: 1;
    }

    .video-num {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .video-title {
      font-size: 0.98rem;
      font-weight: 800;
      line-height: 1.38;
      color: var(--text-primary);
      word-break: keep-all;
    }

    .video-tip {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 6px;
      line-height: 1.4;
    }

    .yt-link-btn {
      text-decoration: none;
      white-space: nowrap;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--yt-red);
      background: var(--yt-soft);
      border: 1px solid var(--yt-border);
      padding: 6px 10px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .video-sentences {
      border-top: 1px solid var(--border);
      background: var(--surface-sub);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sentence-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .sentence-texts {
      flex: 1;
    }

    .s-en {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.35;
      margin-bottom: 3px;
    }

    .s-ko {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.35;
    }

    .s-note {
      font-size: 0.76rem;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    .s-speak-btn {
      border: 1px solid var(--border);
      background: var(--surface-sub);
      color: var(--text-primary);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      font-size: 0.9rem;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .s-speak-btn:active {
      background: #e2e8f0;
    }

    /* Fixed Bottom Control Bar (Flashcard Mode) */
    .bottom-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 480px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      z-index: 30;
    }

    .dock-btn {
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text-primary);
      border-radius: 14px;
      height: 48px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .dock-btn:active {
      transform: scale(0.97);
      background: #f1f5f9;
    }

    .dock-btn-primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .dock-btn-primary:active {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <div class="mode-segmented">
        <button class="seg-btn active" id="tabFlash" onclick="switchMode('flash')">카드 학습</button>
        <button class="seg-btn" id="tabList" onclick="switchMode('list')">전체 목록</button>
        <button class="seg-btn" id="tabShorts" onclick="switchMode('shorts')">📺 유튜브 정리</button>
      </div>
    </div>

    <div class="filter-scroll" id="categoryChips">
      <button class="chip active" data-cat="day3">Day 3 (오늘)</button>
      <button class="chip" data-cat="day2">Day 2</button>
      <button class="chip" data-cat="day1">Day 1</button>
      <button class="chip" data-cat="biz">비즈니스 패턴</button>
      <button class="chip" data-cat="phrasal">필수 구동사</button>
      <button class="chip" data-cat="travel">여행·스몰토크</button>
      <button class="chip" data-cat="all">전체</button>
    </div>

    <div class="shorts-part-filter" id="shortsPartChips" style="display:none;">
      <button class="part-chip active" data-part="all" onclick="filterShortsPart('all', this)">전체 (24개 영상)</button>
      <button class="part-chip" data-part="p1" onclick="filterShortsPart('p1', this)">Part 1. 1초 앞대가리 패턴</button>
      <button class="part-chip" data-part="p2" onclick="filterShortsPart('p2', this)">Part 2. 해외여행 회화</button>
      <button class="part-chip" data-part="p3" onclick="filterShortsPart('p3', this)">Part 3. 필수 구동사</button>
      <button class="part-chip" data-part="p4" onclick="filterShortsPart('p4', this)">Part 4. 원어민 발음</button>
    </div>
  </header>

  <main>
    <!-- Flashcard View -->
    <div class="flashcard-view" id="flashcardView">
      <div class="flashcard" id="flashcard" onclick="toggleReveal()">
        <div>
          <div class="card-header">
            <span class="card-tag" id="cardTag">Day 3</span>
            <span class="card-index" id="cardCounter">1 / 6</span>
          </div>

          <div class="question-section">
            <div class="ko-label">한국어 문장</div>
            <div class="ko-sentence" id="koSentence">나 이제 막 이메일을 보내려던 참이야.</div>
            <div class="hint-pill" id="hintBox">💡 힌트: I'm about to ~</div>
          </div>

          <div class="answer-section">
            <div class="en-label">영어 표현</div>
            <div class="en-sentence" id="enSentence">I'm about to send the email.</div>

            <div class="audio-bar" onclick="event.stopPropagation()">
              <button class="audio-btn" onclick="speakCurrent(0.96)">🔊 보통 속도</button>
              <button class="audio-btn" onclick="speakCurrent(0.75)">🐢 느린 속도</button>
            </div>

            <div class="tip-box" id="tipText">상사나 동료가 '그거 했어?'라고 물을 때 '마침 지금 막 ~하려던 참이에요!'라고 답하는 최고의 패턴입니다.</div>
            <div class="before-box" id="beforeBox" style="display:none;"></div>
          </div>
        </div>

        <div class="reveal-prompt">👆 카드를 터치해서 정답 확인하기</div>
      </div>
    </div>

    <!-- List View -->
    <div class="list-view" id="listView"></div>

    <!-- YouTube Shorts 30 View -->
    <div class="shorts-view" id="shortsView"></div>
  </main>

  <!-- Bottom Navigation Bar for Flashcard Mode -->
  <div class="bottom-dock" id="bottomDock">
    <button class="dock-btn" onclick="prevCard()">‹ 이전 문장</button>
    <button class="dock-btn dock-btn-primary" onclick="nextCard()">다음 문장 ›</button>
  </div>

    let currentCategory = "day3";
    let currentIndex = 0;
    let currentShortsPart = "all";

    function getFilteredCards() {
      if (currentCategory === "all") return cardsData;
      return cardsData.filter(c => c.cat === currentCategory);
    }

    function renderCard() {
      const list = getFilteredCards();
      if (list.length === 0) return;
      if (currentIndex >= list.length) currentIndex = 0;
      if (currentIndex < 0) currentIndex = list.length - 1;

      const card = list[currentIndex];
      const flashcardEl = document.getElementById("flashcard");
      flashcardEl.classList.remove("revealed");

      document.getElementById("cardCounter").textContent = `${currentIndex + 1} / ${list.length}`;
      document.getElementById("cardTag").textContent = card.tag;
      document.getElementById("koSentence").textContent = card.ko;
      document.getElementById("hintBox").textContent = `💡 ${card.hint}`;
      document.getElementById("enSentence").textContent = card.en;
      document.getElementById("tipText").textContent = card.tip;

      const beforeEl = document.getElementById("beforeBox");
      if (card.before) {
        beforeEl.style.display = "block";
        beforeEl.textContent = `✍️ ${card.before}`;
      } else {
        beforeEl.style.display = "none";
      }
    }

    function toggleReveal() {
      document.getElementById("flashcard").classList.toggle("revealed");
    }

    function prevCard() {
      currentIndex--;
      renderCard();
    }

    function nextCard() {
      currentIndex++;
      renderCard();
    }

    function speakText(text, rate = 0.95) {
      if (!("speechSynthesis" in window)) {
        alert("이 브라우저는 음성 읽기를 지원하지 않습니다.");
        return;
      }
      window.speechSynthesis.cancel();
      const cleanText = text.replace(/\[.*?\]/g, "").replace(/\(.*?\)/g, "").replace(/\//g, ". ");
      const utter = new SpeechSynthesisUtterance(cleanText);
      utter.lang = "en-US";
      utter.rate = rate;
      window.speechSynthesis.speak(utter);
    }

    function speakCurrent(rate) {
      const list = getFilteredCards();
      const card = list[currentIndex];
      if (!card) return;
      speakText(card.en, rate);
    }

    function renderList() {
      const list = getFilteredCards();
      const container = document.getElementById("listView");
      container.innerHTML = "";

      list.forEach((card) => {
        const div = document.createElement("div");
        div.className = "list-card";
        div.innerHTML = `
          <div class="list-card-top">
            <span class="card-tag">${card.tag}</span>
            <div class="list-actions">
              <button class="icon-btn" onclick="speakText('${card.en.replace(/'/g, "\\'")}', 0.95)">🔊 보통</button>
              <button class="icon-btn" onclick="speakText('${card.en.replace(/'/g, "\\'")}', 0.75)">🐢 느리게</button>
            </div>
          </div>
          <div class="list-ko">${card.ko}</div>
          <div class="list-en">${card.en}</div>
          <div class="list-tip">${card.tip}</div>
        `;
        container.appendChild(div);
      });
    }

    function renderShorts() {
      const container = document.getElementById("shortsView");
      container.innerHTML = "";

      const filtered = currentShortsPart === "all"
        ? shortsArchive
        : shortsArchive.filter(v => v.part === currentShortsPart);

      filtered.forEach((video) => {
        const card = document.createElement("div");
        card.className = "video-card";

        let rowsHtml = "";
        video.items.forEach((item) => {
          const safeEn = item.en.replace(/'/g, "\\'");
          rowsHtml += `
            <div class="sentence-row">
              <div class="sentence-texts">
                <div class="s-en">${item.en}</div>
                <div class="s-ko">${item.ko}</div>
              </div>
              <button class="s-speak-btn" onclick="speakText('${safeEn}', 0.92)" title="발음 듣기">🔊</button>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="video-header">
            <div class="video-title-wrap">
              <span class="video-num">${video.num}</span>
              <div class="video-title">${video.title}</div>
              <div class="video-tip">💡 ${video.tip}</div>
            </div>
            <a class="yt-link-btn" href="${video.url}" target="_blank" rel="noopener">▶ 영상 보기</a>
          </div>
          <div class="video-sentences">
            ${rowsHtml}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterShortsPart(part, btnEl) {
      currentShortsPart = part;
      document.querySelectorAll(".part-chip").forEach(b => b.classList.remove("active"));
      btnEl.classList.add("active");
      renderShorts();
    }

    function switchMode(mode) {
      const fView = document.getElementById("flashcardView");
      const lView = document.getElementById("listView");
      const sView = document.getElementById("shortsView");
      const dock = document.getElementById("bottomDock");
      const catChips = document.getElementById("categoryChips");
      const partChips = document.getElementById("shortsPartChips");

      const tFlash = document.getElementById("tabFlash");
      const tList = document.getElementById("tabList");
      const tShorts = document.getElementById("tabShorts");

      tFlash.classList.remove("active");
      tList.classList.remove("active");
      tShorts.classList.remove("active");

      if (mode === "flash") {
        fView.style.display = "flex";
        lView.style.display = "none";
        sView.style.display = "none";
        dock.style.display = "grid";
        catChips.style.display = "flex";
        partChips.style.display = "none";
        tFlash.classList.add("active");
      } else if (mode === "list") {
        fView.style.display = "none";
        lView.style.display = "flex";
        sView.style.display = "none";
        dock.style.display = "none";
        catChips.style.display = "flex";
        partChips.style.display = "none";
        tList.classList.add("active");
        renderList();
      } else if (mode === "shorts") {
        fView.style.display = "none";
        lView.style.display = "none";
        sView.style.display = "flex";
        dock.style.display = "none";
        catChips.style.display = "none";
        partChips.style.display = "flex";
        tShorts.classList.add("active");
        renderShorts();
      }
    }

    document.querySelectorAll(".chip").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".chip").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentCategory = btn.getAttribute("data-cat");
        currentIndex = 0;
        renderCard();
        renderList();
      });
    });

    renderCard();
  </script>
</body>
</html>
