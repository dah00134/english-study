<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="영어 트레이닝" />
  <title>영어 트레이닝</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-sub: #f8fafc;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --primary-border: #bfdbfe;
      --success: #16a34a;
      --success-soft: #f0fdf4;
      --success-border: #bbf7d0;
      --yt-red: #dc2626;
      --yt-soft: #fef2f2;
      --yt-border: #fecaca;
      --warning-bg: #fffbeb;
      --warning-text: #b45309;
      --warning-border: #fde68a;
      --danger-bg: #fef2f2;
      --danger-text: #b91c1c;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 8px 24px -4px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: calc(76px + env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 12px 16px 12px;
      border-bottom: 1px solid var(--border);
    }

    .top-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
    }

    .mode-segmented {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1.1fr;
      width: 100%;
      background: #f1f5f9;
      padding: 3px;
      border-radius: 10px;
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 7px 4px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .seg-btn.active {
      background: var(--surface);
      color: var(--text-primary);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    /* Filter Chips */
    .filter-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .filter-scroll::-webkit-scrollbar {
      display: none;
    }

    .chip {
      white-space: nowrap;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: var(--surface-sub);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip.active {
      background: var(--text-primary);
      color: #ffffff;
      border-color: var(--text-primary);
    }

    main {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    /* Flashcard Mode */
    .flashcard-view {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 14px;
    }

    .flashcard {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px 20px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 360px;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }

    .flashcard.revealed {
      border-color: var(--primary-border);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .card-tag {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 5px 10px;
      border-radius: 8px;
    }

    .card-index {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .question-section {
      margin-bottom: 16px;
    }

    .ko-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .ko-sentence {
      font-size: 1.3rem;
      font-weight: 800;
      line-height: 1.48;
      color: var(--text-primary);
      word-break: keep-all;
      margin-bottom: 14px;
    }

    .hint-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--warning-text);
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      padding: 8px 12px;
      border-radius: 10px;
      line-height: 1.4;
      width: 100%;
    }

    .answer-section {
      display: none;
      margin-top: 16px;
      padding-top: 18px;
      border-top: 1.5px dashed var(--border);
      animation: slideDown 0.2s ease-out;
    }

    .flashcard.revealed .answer-section {
      display: block;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .en-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .en-sentence {
      font-size: 1.26rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.42;
      margin-bottom: 14px;
    }

    .audio-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .audio-btn {
      border: 1px solid var(--border-strong);
      background: var(--surface-sub);
      color: var(--text-primary);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .audio-btn:active {
      background: #e2e8f0;
    }

    .tip-box {
      font-size: 0.88rem;
      color: var(--text-secondary);
      background: var(--surface-sub);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.55;
      word-break: keep-all;
    }

    .before-box {
      margin-top: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--danger-text);
      background: var(--danger-bg);
      padding: 9px 12px;
      border-radius: 10px;
      line-height: 1.45;
    }

    .reveal-prompt {
      margin-top: 20px;
      padding: 13px;
      border-radius: 12px;
      background: var(--primary-soft);
      color: var(--primary);
      text-align: center;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .flashcard.revealed .reveal-prompt {
      display: none;
    }

    /* Practice / Speaking Quiz Mode */
    .quiz-view {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .quiz-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px 20px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .quiz-input {
      width: 100%;
      border: 1.5px solid var(--border-strong);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.98rem;
      font-family: inherit;
      outline: none;
    }

    .quiz-input:focus {
      border-color: var(--primary);
    }

    .quiz-btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .quiz-btn {
      border: 1px solid var(--border-strong);
      background: var(--surface-sub);
      color: var(--text-primary);
      padding: 11px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
    }

    .quiz-btn.primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .quiz-feedback {
      display: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .quiz-feedback.correct {
      display: block;
      background: var(--success-soft);
      border: 1px solid var(--success-border);
      color: #14532d;
    }

    .quiz-feedback.check {
      display: block;
      background: var(--primary-soft);
      border: 1px solid var(--primary-border);
      color: var(--text-primary);
    }

    /* List Mode */
    .list-view {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .list-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }

    .list-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .list-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      border: 1px solid var(--border);
      background: var(--surface-sub);
      color: var(--text-secondary);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .list-ko {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .list-en {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .list-tip {
      font-size: 0.82rem;
      color: var(--text-secondary);
      background: var(--surface-sub);
      padding: 8px 10px;
      border-radius: 8px;
      line-height: 1.45;
    }

    /* Shorts 30 Archive Mode */
    .shorts-view {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .shorts-part-filter {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      margin-bottom: 4px;
    }
    .shorts-part-filter::-webkit-scrollbar {
      display: none;
    }

    .part-chip {
      white-space: nowrap;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      background: #e2e8f0;
      color: var(--text-secondary);
      border: none;
      cursor: pointer;
    }

    .part-chip.active {
      background: var(--primary);
      color: #ffffff;
    }

    .video-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .video-header {
      padding: 15px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      background: var(--surface);
    }

    .video-title-wrap {
      flex: 1;
    }

    .video-num {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .video-title {
      font-size: 0.98rem;
      font-weight: 800;
      line-height: 1.38;
      color: var(--text-primary);
      word-break: keep-all;
    }

    .video-tip {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 6px;
      line-height: 1.4;
    }

    .yt-link-btn {
      text-decoration: none;
      white-space: nowrap;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--yt-red);
      background: var(--yt-soft);
      border: 1px solid var(--yt-border);
      padding: 6px 10px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .video-sentences {
      border-top: 1px solid var(--border);
      background: var(--surface-sub);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sentence-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .sentence-texts {
      flex: 1;
    }

    .s-en {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.35;
      margin-bottom: 3px;
    }

    .s-ko {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.35;
    }

    .s-speak-btn {
      border: 1px solid var(--border);
      background: var(--surface-sub);
      color: var(--text-primary);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      font-size: 0.9rem;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Fixed Bottom Control Bar */
    .bottom-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 480px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      z-index: 30;
    }

    .dock-btn {
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text-primary);
      border-radius: 14px;
      height: 48px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .dock-btn-primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <div class="mode-segmented">
        <button class="seg-btn active" id="tabFlash" onclick="switchMode('flash')">카드 학습</button>
        <button class="seg-btn" id="tabQuiz" onclick="switchMode('quiz')">실전 테스트</button>
        <button class="seg-btn" id="tabList" onclick="switchMode('list')">전체 목록</button>
        <button class="seg-btn" id="tabShorts" onclick="switchMode('shorts')">📺 유튜브</button>
      </div>
    </div>

    <div class="filter-scroll" id="categoryChips">
      <button class="chip active" data-cat="day1">Day 1 (진행/회신)</button>
      <button class="chip" data-cat="day2">Day 2 (일정/문의)</button>
      <button class="chip" data-cat="day3">Day 3 (마무리/당부)</button>
      <button class="chip" data-cat="day4">Day 4 (의견/이해)</button>
      <button class="chip" data-cat="day5">Day 5 (요청/제안)</button>
      <button class="chip" data-cat="day6">Day 6 (문제해결)</button>
      <button class="chip" data-cat="day7">Day 7 (스몰토크)</button>
      <button class="chip" data-cat="all">전체 문장</button>
    </div>

    <div class="shorts-part-filter" id="shortsPartChips" style="display:none;">
      <button class="part-chip active" data-part="all" onclick="filterShortsPart('all', this)">전체 (30개 영상)</button>
      <button class="part-chip" data-part="p1" onclick="filterShortsPart('p1', this)">Part 1. 1초 앞대가리 패턴</button>
      <button class="part-chip" data-part="p2" onclick="filterShortsPart('p2', this)">Part 2. 해외여행 회화</button>
      <button class="part-chip" data-part="p3" onclick="filterShortsPart('p3', this)">Part 3. 필수 구동사</button>
      <button class="part-chip" data-part="p4" onclick="filterShortsPart('p4', this)">Part 4. 원어민 발음</button>
    </div>
  </header>

  <main>
    <!-- Flashcard View -->
    <div class="flashcard-view" id="flashcardView">
      <div class="flashcard" id="flashcard" onclick="toggleReveal()">
        <div>
          <div class="card-header">
            <span class="card-tag" id="cardTag">Day 1</span>
            <span class="card-index" id="cardCounter">1 / 6</span>
          </div>

          <div class="question-section">
            <div class="ko-label">한국어 문장</div>
            <div class="ko-sentence" id="koSentence"></div>
            <div class="hint-pill" id="hintBox"></div>
          </div>

          <div class="answer-section">
            <div class="en-label">영어 표현</div>
            <div class="en-sentence" id="enSentence"></div>

            <div class="audio-bar" onclick="event.stopPropagation()">
              <button class="audio-btn" onclick="speakCurrent(0.96)">🔊 보통 속도</button>
              <button class="audio-btn" onclick="speakCurrent(0.75)">🐢 느린 속도</button>
            </div>

            <div class="tip-box" id="tipText"></div>
            <div class="before-box" id="beforeBox" style="display:none;"></div>
          </div>
        </div>

        <div class="reveal-prompt">👆 카드를 터치해서 정답 확인하기</div>
      </div>
    </div>

    <!-- Self Quiz / Speaking Practice View -->
    <div class="quiz-view" id="quizView">
      <div class="quiz-card">
        <div class="card-header" style="margin-bottom:4px;">
          <span class="card-tag" id="qTag">Day 1 실전 테스트</span>
          <span class="card-index" id="qCounter">1 / 6</span>
        </div>
        <div class="ko-sentence" id="qKo" style="margin-bottom:6px;"></div>
        <div class="hint-pill" id="qHint"></div>

        <input type="text" class="quiz-input" id="quizInput" placeholder="영어로 직접 입력하거나 음성 입력(🎤) 해보세요" autocomplete="off" />

        <div class="quiz-btn-row">
          <button class="quiz-btn primary" onclick="checkQuizAnswer()">정답 비교하기</button>
          <button class="quiz-btn" onclick="speakCurrent(0.95)">🔊 정답 발음 듣기</button>
        </div>

        <div class="quiz-feedback" id="quizFeedback"></div>
      </div>
    </div>

    <!-- List View -->
    <div class="list-view" id="listView"></div>

    <!-- YouTube Shorts 30 View -->
    <div class="shorts-view" id="shortsView"></div>
  </main>

  <!-- Bottom Navigation Bar -->
  <div class="bottom-dock" id="bottomDock">
    <button class="dock-btn" onclick="prevCard()">‹ 이전 문장</button>
    <button class="dock-btn dock-btn-primary" onclick="nextCard()">다음 문장 ›</button>
  </div>

  <script>
    // Self-paced 7-Day Complete Business & Daily Speaking Curriculum
    const cardsData = [
      // Day 1: 진행 상황 공유 & 회신 약속
      {
        id: "d1-1",

        tag: "Day 1 · 바쁜 상황 알리기",

        en: "I'm in the middle of something. I'll get back to you later.",
        tip: "something 앞에는 'a'를 붙이지 않습니다! '다시 연락/답변하다'는 전화·메일 모두 get back to you!",

      },
      {

        tag: "Day 1 · 정중한 거절/양해",

        hint: "앞머리: I'm afraid ~ / I'm in the middle of ~",
        en: "I'm afraid I'm in the middle of a meeting right now.",
        tip: "내 잘못이 아닌데 아쉬운 소식을 전할 땐 Sorry 대신 'I'm afraid ~'로 시작하면 프로페셔널합니다."
      },
      {
        id: "d1-3",
        cat: "day1",
        tag: "Day 1 · 업무 진행 & 회신",
        ko: "제가 지금 그 이슈를 확인(작업) 중입니다. 곧 다시 답변드릴게요.",
        hint: "앞머리: I'm working on ~ / I'll get back ~",
        en: "I'm working on the issue. I'll get back to you soon.",
        tip: "get back to you 자체에 '결과/답변을 가지고 다시 연락하다'라는 뜻이 모두 들어있습니다.",
        before: "내 첫 문장: I'll get answer to you soon."
      },

      },
      {
        part: "p4",
        num: "영상 28, 29, 30",
        title: "원어민 발음 & 리스닝 비결 (패밀리 / 와루아이 / 헤롬나우)",
        url: "https://www.youtube.com/shorts/vUW2tkF8Soc",
        tip: "강세 없는 모음 생략하기, Why do I 연음[와루아이], head home[헤롬] 소리 비결입니다.",
        items: [
          { en: "camera / family / everybody", ko: "원어민 발음: [캠-러] / [패믈리] / [에브리바리]" },
          { en: "memory / delivery", ko: "원어민 발음: [메므리] / [들리브리]" },
          { en: "Why do I say that?", ko: "[와루아이 세이 댓?] 내가 왜 그런 말을 했지?" },
          { en: "Why do I feel so tired today?", ko: "[와루아이 필 쏘 타이어드 투데이?] 오늘따라 왜 이리 피곤하지?" },
          { en: "Why do I do this every time?", ko: "[와루아이 두 디스 에브리 타임?] 난 왜 매번 이럴까?" },
          { en: "I'm gonna head home now.", ko: "[암거너 헤롬나우] 나 이제 집으로 갈게." }
        ]
      }
    ];

    let currentCategory = "day1";
    let currentIndex = 0;
    let currentShortsPart = "all";

    function getFilteredCards() {
      if (currentCategory === "all") return cardsData;
      return cardsData.filter(c => c.cat === currentCategory);
    }

    function renderCard() {
      const list = getFilteredCards();
      if (list.length === 0) return;
      if (currentIndex >= list.length) currentIndex = 0;
      if (currentIndex < 0) currentIndex = list.length - 1;

      const card = list[currentIndex];
      const flashcardEl = document.getElementById("flashcard");
      flashcardEl.classList.remove("revealed");

      document.getElementById("cardCounter").textContent = `${currentIndex + 1} / ${list.length}`;
      document.getElementById("cardTag").textContent = card.tag;
      document.getElementById("koSentence").textContent = card.ko;
      document.getElementById("hintBox").textContent = `💡 ${card.hint}`;
      document.getElementById("enSentence").textContent = card.en;
      document.getElementById("tipText").textContent = card.tip;

      const beforeEl = document.getElementById("beforeBox");
      if (card.before) {
        beforeEl.style.display = "block";
        beforeEl.textContent = `✍️ ${card.before}`;
      } else {
        beforeEl.style.display = "none";
      }

      // Update Quiz view as well
      document.getElementById("qCounter").textContent = `${currentIndex + 1} / ${list.length}`;
      document.getElementById("qTag").textContent = card.tag;
      document.getElementById("qKo").textContent = card.ko;
      document.getElementById("qHint").textContent = `💡 ${card.hint}`;
      document.getElementById("quizInput").value = "";
      const fb = document.getElementById("quizFeedback");
      fb.className = "quiz-feedback";
      fb.innerHTML = "";
    }

    function checkQuizAnswer() {
      const list = getFilteredCards();
      const card = list[currentIndex];
      if (!card) return;

      const userVal = document.getElementById("quizInput").value.trim();
      const fb = document.getElementById("quizFeedback");

      const normalize = (s) => s.toLowerCase().replace(/[^a-z0-9\s]/g, "").replace(/\s+/g, " ").trim();
      const isExact = userVal && normalize(card.en).includes(normalize(userVal)) && normalize(userVal).length > 8;

      if (isExact) {
        fb.className = "quiz-feedback correct";
        fb.innerHTML = `<strong>🎉 정확합니다!</strong><br>정답: <b>${card.en}</b><br><span style="font-size:0.82rem;">${card.tip}</span>`;
      } else {
        fb.className = "quiz-feedback check";
        fb.innerHTML = `<strong>✅ 모범 정답과 비교해 보세요:</strong><br><b style="color:#2563eb;font-size:1.05rem;">${card.en}</b><br><span style="font-size:0.82rem;color:#475569;">${card.tip}</span>`;
      }
    }

    function toggleReveal() {
      document.getElementById("flashcard").classList.toggle("revealed");
    }

    function prevCard() {
      currentIndex--;
      renderCard();
    }

    function nextCard() {
      currentIndex++;
      renderCard();
    }

    function speakText(text, rate = 0.95) {
      if (!("speechSynthesis" in window)) {
        alert("이 브라우저는 음성 읽기를 지원하지 않습니다.");
        return;
      }
      window.speechSynthesis.cancel();
      const cleanText = text.replace(/\[.*?\]/g, "").replace(/\(.*?\)/g, "").replace(/\//g, ". ");
      const utter = new SpeechSynthesisUtterance(cleanText);
      utter.lang = "en-US";
      utter.rate = rate;
      window.speechSynthesis.speak(utter);
    }

    function speakCurrent(rate) {
      const list = getFilteredCards();
      const card = list[currentIndex];
      if (!card) return;
      speakText(card.en, rate);
    }

    function renderList() {
      const list = getFilteredCards();
      const container = document.getElementById("listView");
      container.innerHTML = "";

      list.forEach((card) => {
        const div = document.createElement("div");
        div.className = "list-card";
        div.innerHTML = `
          <div class="list-card-top">
            <span class="card-tag">${card.tag}</span>
            <div class="list-actions">
              <button class="icon-btn" onclick="speakText('${card.en.replace(/'/g, "\\'")}', 0.95)">🔊 보통</button>
              <button class="icon-btn" onclick="speakText('${card.en.replace(/'/g, "\\'")}', 0.75)">🐢 느리게</button>
            </div>
          </div>
          <div class="list-ko">${card.ko}</div>
          <div class="list-en">${card.en}</div>
          <div class="list-tip">${card.tip}</div>
        `;
        container.appendChild(div);
      });
    }

    function renderShorts() {
      const container = document.getElementById("shortsView");
      container.innerHTML = "";

      const filtered = currentShortsPart === "all"
        ? shortsArchive
        : shortsArchive.filter(v => v.part === currentShortsPart);

      filtered.forEach((video) => {
        const card = document.createElement("div");
        card.className = "video-card";

        let rowsHtml = "";
        video.items.forEach((item) => {
          const safeEn = item.en.replace(/'/g, "\\'");
          rowsHtml += `
            <div class="sentence-row">
              <div class="sentence-texts">
                <div class="s-en">${item.en}</div>
                <div class="s-ko">${item.ko}</div>
              </div>
              <button class="s-speak-btn" onclick="speakText('${safeEn}', 0.92)" title="발음 듣기">🔊</button>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="video-header">
            <div class="video-title-wrap">
              <span class="video-num">${video.num}</span>
              <div class="video-title">${video.title}</div>
              <div class="video-tip">💡 ${video.tip}</div>
            </div>
            <a class="yt-link-btn" href="${video.url}" target="_blank" rel="noopener">▶ 영상 보기</a>
          </div>
          <div class="video-sentences">
            ${rowsHtml}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterShortsPart(part, btnEl) {
      currentShortsPart = part;
      document.querySelectorAll(".part-chip").forEach(b => b.classList.remove("active"));
      btnEl.classList.add("active");
      renderShorts();
    }

    function switchMode(mode) {
      const fView = document.getElementById("flashcardView");
      const qView = document.getElementById("quizView");
      const lView = document.getElementById("listView");
      const sView = document.getElementById("shortsView");
      const dock = document.getElementById("bottomDock");
      const catChips = document.getElementById("categoryChips");
      const partChips = document.getElementById("shortsPartChips");

      const tFlash = document.getElementById("tabFlash");
      const tQuiz = document.getElementById("tabQuiz");
      const tList = document.getElementById("tabList");
      const tShorts = document.getElementById("tabShorts");

      tFlash.classList.remove("active");
      tQuiz.classList.remove("active");
      tList.classList.remove("active");
      tShorts.classList.remove("active");

      fView.style.display = "none";
      qView.style.display = "none";
      lView.style.display = "none";
      sView.style.display = "none";

      if (mode === "flash") {
        fView.style.display = "flex";
        dock.style.display = "grid";
        catChips.style.display = "flex";
        partChips.style.display = "none";
        tFlash.classList.add("active");
      } else if (mode === "quiz") {
        qView.style.display = "flex";
        dock.style.display = "grid";
        catChips.style.display = "flex";
        partChips.style.display = "none";
        tQuiz.classList.add("active");
      } else if (mode === "list") {
        lView.style.display = "flex";
        dock.style.display = "none";
        catChips.style.display = "flex";
        partChips.style.display = "none";
        tList.classList.add("active");
        renderList();
      } else if (mode === "shorts") {
        sView.style.display = "flex";
        dock.style.display = "none";
        catChips.style.display = "none";
        partChips.style.display = "flex";
        tShorts.classList.add("active");
        renderShorts();
      }
    }

    document.querySelectorAll(".chip").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".chip").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentCategory = btn.getAttribute("data-cat");
        currentIndex = 0;
        renderCard();
        renderList();
      });
    });

    renderCard();
  </script>
</body>
</html>
